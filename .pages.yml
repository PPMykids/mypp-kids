media:
  input: assets/images
  output: /assets/images

content:
  - name: products
    label: Sản phẩm
    type: file
    path: products.json
    format: json
    fields:
      - name: products
        label: Danh sách sản phẩm
        type: object
        list: true
        fields:
          - name: name
            label: Tên sản phẩm
            type: string
          - name: price
            label: Giá bán
            type: number
          - name: oldPrice
            label: Giá cũ
            type: number
          - name: product_code
            label: Mã sản phẩm
            type: string
          - name: description
            label: Mô tả
            type: text
          - name: image
            label: Hình ảnh
            type: image